  - unidade: 6
    nome: Juiz Opus + backoffice
    executor: "@dev"
    contexto: "~180k"
    stories:
      - id: "6.1"
        titulo: "Juiz automático por entrega"
        rastreia: [FR-16, NFR-5, CON-5]
        spec: ["§11"]
        depende_de: ["4.4"]
        tarefas:
          - "Carregar a skill claude-api antes de codar (preços, cache de prompt, saída estruturada)"
          - "Job juiz: entrada mínima por tamanho e modo (spec §11); teto de imagens em config"
          - "Prompt com a rubrica (cobertura, núcleo, números, frases órfãs, layout) e schema de saída; 1 nova tentativa se inválido"
          - "Grava avaliacoes_juiz e as colunas do juiz em metricas_entrega (tokens, custo)"
          - "Antes de cada chamada à Anthropic, confere exclusao_pendente/excluido/expirado; se marcado, não chama e conclui a remoção (spec §7)"
          - "Conjunto de 10 entregas com defeito plantado em engine/tests/juiz/"
        criterios_aceite:
          - "Juiz roda em 100% das entregas prontas do E2E"
          - "Aponta ≥ 9 dos 10 defeitos plantados"
          - "Excluir o documento durante um job juiz → nenhuma chamada à Anthropic depois da exclusão e nada gravado"
          - "Custo médio por documento registrado e comparado com o ≈ R$ 0,60 da revisão §6"

      - id: "6.2"
        titulo: "API do backoffice e métricas"
        rastreia: [FR-10, FR-17, FR-19, FR-20]
        spec: ["§9 backoffice", "§9 motivos da fila", "§12", "§14 exclusão da conta"]
        depende_de: ["4.5", "3.1"]
        tarefas:
          - "Rotas /admin/* do spec §9 (fila, detalhe, revisão, perfil, reprocessar, cancelar, problemas, usuários, recarga, exclusão de conta, métricas json/csv, config)"
          - "Motivos da fila com os limiares de Q6 (nota ≤ 3; divergência juiz × usuário do spec §9; juiz sem nota em 48 h) e a amostra de 10% (Q11)"
          - "Anexar perfil a documento recusado com motivo template_novo: validar_perfil; salvar privado (dono = usuário do documento) ou semente; documento volta à triagem sem cobrança e segue para aguardando_confirmacao com a sobretaxa (Q3)"
          - "Revisão atualiza intervencao_humana e minutos_humanos; concorda_juiz nulo quando não há juiz"
          - "Reprocessar de em_revisao, pronto e falhou com as regras de crédito e estado do spec §5: de pronto o status não muda (reprocessando = true); grava jobs.estado_origem; de falhou, nova reserva com motivo e criado_por = admin"
          - "Métricas filtram internos por padrão (incluir_internos=false; Q15); uso do Storage × storage_teto_mb (DT-20)"
        criterios_aceite:
          - "Cada motivo da fila (inclusive amostra de 10% e pedido de perfil) aparece com um caso de teste e sai depois da revisão"
          - "Perfil anexado a um template_novo → triagem → aguardando_confirmacao com a sobretaxa; documento expirado antes disso sai da fila"
          - "Reprocessar: os três estados de origem × sucesso/gate/falha batem com a tabela do spec §5 (falhou × gate → em_revisao com reserva aberta); ledger sem reserva órfã"
          - "Excluir durante um reprocessamento → nada no Storage, nenhuma chamada à Anthropic depois"
          - "Recarga gera lançamento com criado_por = admin"
          - "CSV de métricas tem uma linha por entrega com todas as colunas do spec §12"

      - id: "6.3"
        titulo: "Telas do backoffice"
        rastreia: [FR-10, FR-17, FR-19, FR-20, PL2]
        spec: ["§10 A1–A6"]
        depende_de: ["6.2", "5.1"]
        tarefas:
          - "A1 fila, A2 revisão, A3 pedido de perfil (template_novo; dias até expirar; baixar original; colar ou enviar JSON; reenviar à triagem), A4 usuários (recarga; excluir conta a pedido), A5 métricas com uso do Storage e workers vivos, A6 configuração"
          - "Criar conta e redefinir senha ficam no painel do Supabase (DT-19, ASM-6); a A4 só mostra o link"
        criterios_aceite:
          - "Responsável revisa um caso de nota baixa e um pedido de perfil de ponta a ponta, registrando minutos"
          - "A5 mostra as metas do piloto §4 com o valor atual e o uso do Storage contra o teto"

  - unidade: 7
    nome: Deploy (infraestrutura gratuita, DT-17)
    executor: "@devops"
    contexto: "~120k"
    stories:
      - id: "7.1"
        titulo: "Supabase Free de produção"
        rastreia: [CON-1, CON-8, CON-10, ASM-5]
        spec: ["§6 Storage", "§13", "DT-14", "DT-17", "DT-19"]
        tarefas:
          - "Projeto Free em sa-east-1 (Q10, Q18); limite de objeto do Storage em 50 MB (partes de 42 MB, DT-18)"
          - "Auth: cadastro aberto desligado; e-mail com senha; confirmação de e-mail desligada (contas criadas no painel, DT-19); sem SMTP (Q8, Q12)"
          - "Connection strings do Supavisor: modo sessão (5432) para o worker, modo transação (6543) para a API (DT-14); conferir o limite de conexões do plano"
          - "Aplicar migrations e seed; primeiro admin por SQL; sem backups (plano Free; Q16)"
          - "Cron gratuito (Vercel) chamando /health 1×/dia para o projeto não pausar por inatividade"
