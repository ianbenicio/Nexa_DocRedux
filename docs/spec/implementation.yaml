# Plano de implementação — plataforma de testes do piloto do DocRedux
# Fase 6 do Spec Pipeline (@architect). Quebra as unidades 2–8 de docs/plano-de-execucao.md
# em stories prontas para o @sm (*draft). Cada story rastreia para requirements.json (FR/NFR/CON)
# e para as seções de spec.md. Nenhuma story inventa feature: as decisões estão em spec.md §18.
# v1.3 (2026-11-18): respostas Q1–Q18 aplicadas; infraestrutura gratuita (DT-17 a DT-20).

storyId: DOCREDUX-PILOTO
plannedAt: "2026-11-18T21:00:00-03:00"
plannedBy: "@architect"
specVersion: "1.3"
complexity: STANDARD
workflow: "SDC por story (@sm *draft → @po *validate → executor → @qa *qa-gate); push/deploy só @devops"

convencoes:
  ids: "{unidade}.{n} — ex.: 2.3"
  local_das_stories: "docs/stories/ do repositório https://github.com/ianbenicio/Nexa_DocRedux.git (Q1)"
  regressao_motor: "toda story que toca engine/ roda a regressão dos ex. 01–05 antes do merge (NFR-6)"
  sem_push: "nenhuma story faz git push nem deploy; isso é da unidade 7 (@devops)"
  contexto_por_sessao: "cada unidade cabe numa sessão (D9); limites em plano-de-execucao.md §3"
  custo_fixo_zero: "nenhuma story contrata serviço pago (CON-10); o único custo variável é o juiz (Anthropic)"

dependencias_entre_unidades:
  "2": []
  "3": []            # só precisa dos JSON de perfis/ para o seed; pode rodar em paralelo à 2
  "4": ["2", "3"]
  "5": ["4"]         # pode começar com a API mockada depois da 4.1, mas o aceite exige a 4 pronta
  "6": ["4", "5"]    # 6.1 e 6.2 dependem só da 4; 6.3 usa o esqueleto do web da 5.1
  "7": ["4", "5", "6"]
  "8": ["7"]

# Q1–Q18 respondidas em 2026-11-18 (spec §18): nenhuma story está bloqueada por pergunta.
perguntas_que_bloqueiam: {}

# Pendências só de execução, conferidas na unidade 7 (spec §18):
pendencias_de_execucao:
  - "Capacidade da Oracle Always Free A1 em São Paulo e verificação por cartão no cadastro (ASM-7); sem capacidade, o worker do piloto fica no PC do responsável"
  - "Limites de conexão do Supavisor no plano gratuito (worker em modo sessão, API em modo transação)"
  - "Limites das funções Python na Vercel Hobby (tamanho do corpo, duração) contra as rotas do spec §9"

unidades:

  - unidade: 2
    nome: Motor como biblioteca
    executor: "@dev"
    contexto: "~180k"
    stories:
      - id: "2.1"
        titulo: "Repositório e esqueleto do monorepo"
        rastreia: [CON-1, CON-7]
        spec: ["§3"]
        tarefas:
          - "Clonar https://github.com/ianbenicio/Nexa_DocRedux.git (Q1), ou git init com esse remote se estiver vazio; commits locais; push só pelo @devops"
          - "Esqueleto engine/ api/ web/ db/ deploy/ docs/ com README de cada pasta"
          - ".gitignore: PDFs de exemplos, .env, saídas; fixtures dos ex. 01–05 fora do git, apontadas por DOCREDUX_FIXTURES"
          - "Copiar docs/spec/ e docs/plano-de-execucao.md para o repositório"
        criterios_aceite:
          - "git status limpo após o commit inicial; nenhum PDF nem segredo versionado"
          - "Estrutura igual à do spec.md §3"

      - id: "2.2"
        titulo: "Migrar scripts/ para o pacote docredux_engine, sem mudar comportamento"
        rastreia: [NFR-6, CON-6]
        spec: ["§3 (dependências)", "§4 regras do contrato", "DT-11"]
        depende_de: ["2.1"]
        tarefas:
          - "pyproject.toml (Python ≥ 3.12, PyMuPDF 1.28.x, python-docx 1.2.x); módulos ficha/, relatorio/, verify/, folha.py a partir de scripts/*.py"
          - "Caminho do LibreOffice por DOCREDUX_SOFFICE (hoje fixo em scripts/render_relatorio.py:23); -env:UserInstallation por chamada"
          - "cli.py: python -m docredux_engine processar|folha com saída JSON"
          - "Imagem base Linux (Python + LibreOffice da mesma linha do baseline + fonts-crosextra-carlito + fonts-liberation); registrar a versão do LibreOffice do Windows"
          - "render_docx.py passa a usar Carlito no lugar da Calibri (Q13, aceito)"
          - "engine/tests/regressao.py: roda ex. 01–05 e compara páginas e cobertura com o LOG.md, no Windows e no container"
        criterios_aceite:
          - "Ex. 01–05 no container: 52→19, 34→14, 16→5, 26→12, 294→142 páginas; se a Carlito mudar alguma contagem, novo baseline registrado no LOG.md (Q13)"
          - "Cobertura ≥ 99,96%, 100%, 100%, 100%, 99,97% em qualquer caso"
        verificacao: "saída do regressao.py (Windows e container) anexada à story"

      - id: "2.3"
        titulo: "Contrato público: triar, processar, folha_contato, validar_perfil"
        rastreia: [FR-5, FR-6, FR-8, FR-12, FR-13, FR-14]
        spec: ["§4"]
        depende_de: ["2.2"]
        tarefas:
          - "Tipos Opcoes, Triagem, Modificacao, Relatorio, Resultado e exceções (spec §4)"
          - "triar: recusa escaneado (sem camada de texto), protegido, corrompido, excede_paginas (> 300); tipo e perfil pela assinatura de fontes (perfil_id nulo quando nenhum casa); contagem de palavras"
          - "processar: despacho por perfil['tipo']; gate de cobertura 99,5% no modo original; relatório com modificações (removido/reorganizado), estrutura, regras disparadas e tempos"
          - "Síntese só para relatório (Q4): sintese_disponivel = false em ficha"
          - "validar_perfil com JSON Schema derivado de perfis/*.json"
          - "Testes unitários com PDFs sintéticos (escaneado, com senha, corrompido, template desconhecido)"
        criterios_aceite:
          - "triar acerta tipo e perfil dos ex. 01–05"
          - "Os três casos de recusa retornam o motivo certo; template desconhecido retorna perfil_id nulo"
          - "Relatorio serializa em JSON e tem todos os campos do spec §4"
          - "Regressão 2.2 continua verde"

      - id: "2.4"
        titulo: "Síntese extrativa no documento inteiro, ligada ao render"
        rastreia: [FR-6, FR-13, CON-6]
        spec: ["§4 síntese"]
        depende_de: ["2.3"]
        tarefas:
          - "Generalizar scripts/sintese_extrativa.py de --capitulo para o documento inteiro (só relatórios, Q4)"
          - "Ligar a saída ao render_relatorio (DOCX e PDF)"
          - "Relatorio.fracao_real e Relatorio.condensado; marcação '[…]' e página de origem por trecho"
        criterios_aceite:
          - "Ex. 05 em 20/35/50%: fração real a até 1 ponto do alvo"
          - "Toda frase da saída existe no original (teste automático de inclusão)"
          - "Núcleo (PROBLEMA e CAUSAS CRÍTICAS) e todas as tabelas/gráficos com legenda presentes em qualquer nível"
          - "Documento inteiro em ≤ 30 s de CPU"

      - id: "2.5"
        titulo: "Opção manter capa e elementos (U-C)"
        rastreia: [FR-6]
        spec: ["§4 regras do contrato"]
        depende_de: ["2.3"]
        tarefas:
          - "Mapear as regras de remoção de capa, folha de rosto, cabeçalhos e elementos gráficos em REGRAS.md"
          - "Opcoes.manter_capa_elementos desliga essas regras nos dois pipelines"
        criterios_aceite:
          - "Com a opção desligada, a regressão dos ex. 01–05 fica idêntica"
          - "Com a opção ligada, a capa do ex. 05 e os cabeçalhos do ex. 01 aparecem na saída; cobertura não cai"

  - unidade: 3
    nome: Banco e RLS
    executor: "@data-engineer"
    contexto: "~180k"
    stories:
      - id: "3.1"
        titulo: "Schema: tabelas, enums, índices, config e seed"
        rastreia: [FR-2, FR-8, FR-11, FR-15, FR-16, FR-17, FR-19, FR-20]
        spec: ["§6", "§7 índices", "§12"]
        tarefas:
          - "Migrations em db/supabase/migrations para as tabelas do spec §6 (inclui workers, entregas versionadas por (documento_id, versao), feedback_usuario com pk (documento_id, versao), jobs.estado_origem, documentos.partes, perfis_usuario.interno/senha_provisoria/exclusao_conta_em) e metricas_entrega do §12 (inclui colunas de primeira passagem)"
          - "Enum de status sem aguardando_perfil; motivo de recusa template_novo; tipo de lançamento ajuste no ledger"
          - "FKs para auth.users sem ON DELETE CASCADE nas tabelas que ficam depois da exclusão da conta (perfis_usuario, creditos_ledger, metricas_entrega ficam com o id pseudônimo; spec §14 item 4)"
          - "Papel docredux_backend (login, BYPASSRLS, sem superusuário) com os grants de tabela da API e do worker (spec §6)"
          - "Índice parcial da fila e único parcial de job ativo por (documento_id, tipo)"
          - "config com os padrões: limites (300 págs., 80 MB), créditos iniciais 150, juiz_fracao 1.0, limiares de Q6 (nota ≤ 3; juiz sem nota em 48 h), amostra de Q11 (0,10), storage_teto_mb 900 (DT-20), preços do juiz"
          - "seed.sql com os perfis semente (dono null, visíveis a todas as contas; Q5) a partir de perfis/*.json"
          - "Views: fila do backoffice (motivos do spec §9, inclui pedido de perfil) e v_criterios_piloto (spec §12, sem internos; Q15)"
        criterios_aceite:
          - "supabase db reset aplica tudo do zero sem erro"
          - "Views retornam linhas corretas num seed de teste com todos os motivos; documentos excluido/expirado não geram motivo"
          - "Nota da versão 2 de uma entrega não sobrescreve a da versão 1"

      - id: "3.2"
        titulo: "Ledger de créditos e funções do saldo"
        rastreia: [FR-3, FR-9, FR-19, NFR-3]
        spec: ["§5 ciclo do crédito", "§6 invariantes e funções"]
        depende_de: ["3.1"]
        tarefas:
          - "Schema private (não exposto): credito_conceder, credito_reservar (FOR UPDATE no perfil), credito_capturar, credito_estornar e o lançamento ajuste da exclusão da conta (spec §14; nome da função a critério do @data-engineer); SECURITY DEFINER, SET search_path = '', nomes qualificados"
          - "REVOKE EXECUTE FROM PUBLIC, anon, authenticated; GRANT só a docredux_backend e service_role"
          - "Gatilho em auth.users (SECURITY DEFINER): cria perfis_usuario (senha_provisoria = true) e concede coalesce(config.creditos_iniciais, 150)"
          - "Gatilho append-only no ledger; reserva_id em captura/estorno com índice único"
        criterios_aceite:
          - "pgTAP: reserva com saldo insuficiente falha; duas reservas concorrentes não deixam saldo negativo"
          - "Estorno e captura idempotentes (segunda chamada não muda o saldo); captura depois de estorno (e vice-versa) falha"
          - "Invariantes: saldo = soma(ledger); nenhuma reserva aberta em documento de estado final"
          - "Usuário novo nasce com 150, um lançamento de concessão e senha_provisoria = true, mesmo sem a chave em config"
          - "Ajuste de exclusão deixa o saldo em 0 sem apagar lançamentos"
          - "anon e authenticated não executam as funções do saldo; docredux_backend executa"

      - id: "3.3"
        titulo: "RLS, Storage e testes com dois usuários"
        rastreia: [NFR-3, NFR-4, FR-4, CON-8]
        spec: ["§6 RLS e Storage", "§13"]
        depende_de: ["3.2"]
        tarefas:
          - "RLS ligada em todas as tabelas; só SELECT das próprias linhas para authenticated, conforme a tabela do spec §6"
          - "Buckets privados originais (limite de objeto 50 MB; partes original.partNN de até 42 MB, DT-18) e saidas; política de INSERT só na pasta auth.uid()"
          - "db/tests/rls.sql (pgTAP) com os casos do spec §6, mais um teste pela API REST (/rest/v1 e /rest/v1/rpc) com o JWT de cada usuário"
        criterios_aceite:
          - "Todos os casos de 'Testes de RLS obrigatórios' do spec §6 passam por SQL e por REST/RPC"
          - "authenticated não consegue UPDATE em saldo, papel, interno nem senha_provisoria, nem EXECUTE em private.credito_*"

  - unidade: 4
    nome: API + worker
    executor: "@dev"
    contexto: "~180k"
    stories:
      - id: "4.1"
        titulo: "Esqueleto da API: auth, erros, health, me, termo, senha"
        rastreia: [FR-1, FR-18, CON-1]
        spec: ["§9 autenticação, erros, CORS", "§13", "DT-14", "DT-19"]
        tarefas:
          - "FastAPI com validação do JWT do Supabase (chaves do projeto); dependência usuario_atual e exigir_admin"
          - "Formato de erro e códigos do spec §9; CORS só do domínio do web"
          - "GET /health (DB, heartbeat do worker, versão); GET /me (com senha_provisoria); POST /me/termo; POST /me/senha-trocada"
          - "Postgres com o papel de backend pelo pooler em modo transação (6543, sem prepared statements; DT-14); leitura de config"
          - "Mesmo código roda com uvicorn em dev e como função Python da Vercel em produção (DT-17)"
        criterios_aceite:
          - "Sem JWT → 401; usuário comum em /admin → 403; termo não aceito → termo_pendente nas rotas de envio"
          - "POST /me/senha-trocada zera senha_provisoria; GET /me devolve o valor"

      - id: "4.2"
        titulo: "Créditos: orcar, orçamento, confirmação e extrato"
        rastreia: [FR-2, FR-7, FR-9, FR-10]
        spec: ["§5", "§9"]
        depende_de: ["4.1"]
        tarefas:
          - "api/app/creditos.py::orcar (função pura, inteiros, síntese arredondada para cima com mínimo 1 — DT-10, Q9) com todos os casos da tabela do spec §5 em teste unitário"
          - "POST /documentos/{id}/orcamento e /confirmar (409 orcamento_mudou; 402 saldo_insuficiente); sobretaxa de template novo quando o perfil foi criado na A3 para o documento (FR-10)"
          - "GET /creditos/extrato paginado (inclui ajuste)"
        criterios_aceite:
          - "Todos os casos do spec §5 (fronteiras 5/6/15/16/20/21/40/41/60/61; extras; template novo com sobretaxa; síntese em relatório com 400 e 2.000 palavras; ex. 05 = 89/107/126)"
          - "Confirmação concorrente dupla reserva uma vez só"

      - id: "4.3"
        titulo: "Envio: documento idempotente em partes, upload concluído, arquivos"
        rastreia: [FR-4, FR-14, NFR-2, NFR-9]
        spec: ["§9", "DT-3", "DT-18", "DT-20", "§6 Storage"]
        depende_de: ["4.1"]
        tarefas:
          - "POST /documentos com Idempotency-Key (mesma chave → mesmo documento); calcula as partes de 42 MB e devolve os caminhos (DT-18)"
          - "503 capacidade_piloto quando o uso estimado passa de config.storage_teto_mb (DT-20)"
          - "POST /documentos/{id}/upload-concluido: confere todas as partes e a soma dos tamanhos; enfileira triagem ou marca upload_falhou"
          - "GET /documentos, GET /documentos/{id}, GET /documentos/{id}/arquivo (URL assinada de 60 s; DOCX só se comprado)"
        criterios_aceite:
          - "Repetir POST com a mesma chave não cria documento novo"
          - "Upload interrompido → upload_falhou → nova tentativa funciona"
          - "Documento de 62 MB gera 2 partes; faltando uma parte → upload_falhou"
          - "Uso acima do teto → 503 capacidade_piloto"
          - "Usuário B recebe 404 no documento de A"

      - id: "4.4"
        titulo: "Worker: fila SKIP LOCKED, triagem e processamento"
        rastreia: [FR-8, FR-9, FR-10, FR-11, FR-12, FR-20, NFR-1, NFR-8]
        spec: ["§7", "§8", "§12", "DT-1", "DT-2", "DT-5", "DT-18"]
        depende_de: ["4.2", "4.3", "2.3"]
        tarefas:
          - "Conexão pelo Supavisor em modo sessão (5432; DT-14), papel docredux_backend, 1 conexão por processo; só conexões de saída"
          - "worker/loop.py: reivindicação do spec §7, polling de 2 s, workers.visto_em (DT-15), heartbeat de 15 s, coletor de 60 s, backoff"
          - "Motor em subprocesso (cli do engine) com timeout por tipo; timeout volta para a fila como o coletor; diretório temporário e perfil LibreOffice por job"
          - "worker/falhas.py: tratador único de falha final por tipo e origem (spec §7)"
          - "Triagem baixa e concatena as partes do original, confere tamanho e SHA-256 (DT-18); perfil_id nulo → recusado com motivo template_novo, sem reserva, e pedido de perfil na fila (Q3)"
          - "Jobs triagem e processar com as transições do spec §8; entregas versionadas (DT-16); captura só na primeira entrega; enfileira juiz em pronto e em_revisao"
          - "Sem e-mail de pronto (Q8): o status fica na tela"
          - "metricas_entrega preenchida (tamanho, tempos, cobertura, primeira passagem, tentativas, versão do motor, interno)"
          - "exclusao_pendente e status excluido/expirado conferidos no fim de todo job (triagem, processar, juiz): descarta saídas, estorna se a reserva estiver aberta, apaga (spec §7)"
          - "Tratador de falha final de reprocessar usa jobs.estado_origem (de pronto: só reprocessando = false)"
        criterios_aceite:
          - "Excluir durante triagem e durante processar → nada sobe ao Storage; estorno só se a reserva estiver aberta no ledger"
          - "Dois workers não pegam o mesmo job (teste com 20 jobs e 2 processos)"
          - "Matar o worker no meio → job volta à fila e termina; tentativas = 2"
          - "Falha ou timeout nas 3 tentativas → documento falhou + estorno de 100%"
          - "Gate abaixo de 99,5% → em_revisao, sem captura, entrega invisível ao usuário"
          - "Ex. 05 (62 MB, 2 partes) → original remontado com o mesmo SHA-256"
          - "PDF de template desconhecido → recusado (template_novo), saldo intacto, item na fila do backoffice"
          - "/health verde com worker ocioso"

      - id: "4.5"
        titulo: "Pós-entrega e ciclo de vida: avaliação, problemas, cancelar, excluir, retenção, conta"
        rastreia: [FR-15, FR-19, FR-21, CON-8]
        spec: ["§9", "§14"]
        depende_de: ["4.4"]
        tarefas:
          - "PUT /documentos/{id}/avaliacao e POST /documentos/{id}/problemas (validação de página)"
          - "POST /documentos/{id}/cancelar (só na_fila; FR-21) e DELETE /documentos/{id} com as regras do spec §14; estorno decidido pela reserva aberta no ledger, nunca pelo status"
          - "Apagar conteúdo: cancela jobs na_fila do documento (triagem, processar, juiz); job processando → exclusao_pendente"
          - "PUT /avaliacao grava por (documento_id, versao) da entrega atual"
          - "Tarefa diária de retenção no laço do worker, com pg_try_advisory_lock; alcança todos os estados (spec §14); originais em partes apagados juntos"
          - "DELETE /me {confirmacao: 'EXCLUIR'} e DELETE /admin/usuarios/{id} (Q7; spec §14 exclusão da conta): ban imediato no Auth, exclusão de todos os documentos, e-mail e textos livres apagados, saldo zerado com ajuste, exclusao_conta_em gravado; a tarefa diária remove o usuário do Auth quando não houver job vivo"
        criterios_aceite:
          - "Cancelar na fila estorna; cancelar processando → 409; cancelar um pronto em reprocessamento → 409 e a versão atual continua acessível"
          - "Excluir com job juiz na fila → job cancelado, nenhuma chamada à Anthropic"
          - "Expirar em cada estado do spec §14 produz o efeito descrito; reservas abertas são estornadas; métricas ficam"
          - "Excluir em cada estado do spec §14 produz o efeito descrito (em_revisao estorna)"
          - "Excluir a conta com um documento processando → login bloqueado na hora; Storage vazio e usuário fora do Auth depois do job; agregados do piloto inalterados"
          - "Nenhuma reserva aberta em documento de estado final ao fim da suíte"

      - id: "4.6"
        titulo: "Imagem do worker e teste ponta a ponta em dev"
        rastreia: [CON-2, CON-10, NFR-1, NFR-8]
        spec: ["§2", "§3 deploy/", "§16", "DT-17"]
        depende_de: ["4.4", "4.5"]
        tarefas:
          - "Dockerfile do worker (Python 3.12 + LibreOffice + Carlito + Liberation), multi-arquitetura: amd64 (PC) e arm64 (Oracle A1)"
          - "API roda local com uvicorn; configuração da função Python da Vercel (vercel.json) pronta, sem deploy"
          - "deploy/docker-compose.dev.yml com Supabase local (supabase start)"
          - "E2E: ficha (ex. 03) e relatório (ex. 05 em 2 partes) do upload ao pronto; queda do worker no meio"
        criterios_aceite:
          - "E2E verde nos dois documentos; PDFs com as mesmas páginas da regressão"
          - "Ex. 05 termina em ≤ 3 min no container amd64"
          - "Imagem arm64 constrói e roda a regressão (QEMU ou máquina arm64)"

  - unidade: 5
    nome: Front do usuário
    executor: "@dev (+ /impeccable sob demanda)"
    contexto: "~180k"
    stories:
      - id: "5.1"
        titulo: "Esqueleto do web: login com senha, troca obrigatória, termo, layout, cliente da API"
        rastreia: [FR-1, FR-18, NFR-7]
        spec: ["§10 U1, U1b, U2", "DT-19"]
        tarefas:
          - "Next.js 15 (App Router), supabase-js 2.x só para auth; cliente da API com o JWT"
          - "U1 /entrar (signInWithPassword; mensagem neutra para senha errada e e-mail inexistente; sem cadastro nem 'esqueci a senha')"
          - "U1b /trocar-senha obrigatória enquanto senha_provisoria = true (updateUser + POST /me/senha-trocada)"
          - "U2 /termo (bloqueia o resto até aceitar)"
          - "Layout responsivo com saldo no topo"
        criterios_aceite:
          - "Conta com senha provisória → login → troca obrigatória → login com a nova, contra o Supabase local"
          - "Sem termo aceito, qualquer rota redireciona para /termo"

      - id: "5.2"
        titulo: "Envio: upload TUS em partes, triagem, opções e custo"
        rastreia: [FR-4, FR-5, FR-6, FR-7, FR-8, FR-10, NFR-2]
        spec: ["§10 U4", "DT-3", "DT-18", "DT-20"]
        depende_de: ["5.1"]
        tarefas:
          - "tus-js-client 4.x com o JWT renovado em onBeforeRequest; chunks de 6 MB; host de storage direto; 409 → chama upload-concluido; progresso; retomada; erro com nova tentativa"
          - "Blob.slice em partes de 42 MB (DT-18), enviadas em sequência, com uma barra de progresso só; 503 capacidade_piloto com mensagem"
          - "Passo 2: triagem com polling; recusa com motivo; template_novo com o texto do spec §10 U4 (Q3)"
          - "Passo 3: opções (síntese só se sintese_disponivel), custo item a item, saldo depois, sobretaxa quando houver; confirmar"
        criterios_aceite:
          - "Ex. 05 (62 MB) e um PDF de 80 MB sobem em 2 partes e retomam depois de cortar a rede na 2ª parte"
          - "Custo na tela = custo da API para os casos do spec §5"

      - id: "5.3"
        titulo: "Documento: status, visualizador, impressão, downloads, relatórios, avaliação"
        rastreia: [FR-11, FR-13, FR-14, FR-15, FR-19, FR-21, NFR-9]
        spec: ["§10 U5", "DT-4"]
        depende_de: ["5.2"]
        tarefas:
