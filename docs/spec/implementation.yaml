      - id: "7.3"
        titulo: "Web e API na Vercel Hobby, termo final e participantes"
        rastreia: [FR-1, FR-3, FR-18, CON-10, PL1]
        spec: ["§10", "§14", "DT-17"]
        depende_de: ["7.1", "7.2"]
        tarefas:
