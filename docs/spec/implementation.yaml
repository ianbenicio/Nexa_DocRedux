          - "Visualizador pdfjs-dist 4.x sobre o blob baixado uma vez (DT-12); Imprimir a partir do blob; Baixar PDF; Baixar DOCX só se comprado"
          - "Economia (páginas, folhas, faixa de R$ a 0,10–0,20 por página); selo de integridade ou relatório de síntese; relatório de modificações com salto de página"
          - "Nota 1–5 + comentário; marcar problema (página atual pré-preenchida); cancelar só na fila; apagar"
        criterios_aceite:
