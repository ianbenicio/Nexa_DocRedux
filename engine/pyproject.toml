[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docredux-engine"
dynamic = ["version"]
description = "Motor determinístico do DocRedux: reduz e reestrutura PDFs (fichas e relatórios) sem perder informação"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.28,<1.29",
    "python-docx>=1.2,<1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
docredux-engine = "docredux_engine.cli:main"

[tool.setuptools.dynamic]
version = {attr = "docredux_engine.__version__"}

[tool.setuptools.packages.find]
include = ["docredux_engine*"]

[tool.setuptools.package-data]
docredux_engine = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
